; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericCH32V003F4P6]
platform = ch32v
board = genericCH32V003F4P6
framework = ch32v003fun
upload_protocol = minichlink

; Runs on the build host, not the target -- for the wire-format logic in
; i2c_time_sync_protocol.c, which has no MCU/register dependency. Excludes main.c
; (owns its own main(), which would collide with the test runner's) and i2c_time_sync.c
; (the I2C1 peripheral driver, which needs ch32fun.h and only builds for the MCU target).
; Run with: pio test -e native
[env:native]
platform = native
build_src_filter = -<*> +<i2c_time_sync_protocol.c>
